name: 'Build Upgrade on push to upgrade branch'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build for'
        type: choice
        required: true
        options:
          - stlu-dev
          - stlu-int
          - stlu-prod
        default: 'stlu-dev'
      configmanagement:
        description: 'Configmanagement to write image tag to'
        type: string
        required: false
        default: 'gitlab.puzzle.ch/pitc_ruby/deployments/decidim/'
      configmanagement_branch:
        description: 'Configmanagement branch to put the image tag into'
        type: string
        required: false
        default: 'main'
      kustomization_path:
        description: 'Path to kustomization file'
        type: string
        required: true
        default: './deployments/pitc-decidim-stlu-dev/kustomization.yaml'
      identifier:
        description: 'Identifier for commit-message, could be a namespace or project-name'
        type: string
        required: false
        default: 'stlu-dev'
  push:
    branches:
      - 'upgrade'
    paths-ignore:
      - 'doc/**'
      - '**.md'

jobs:
  build-image:
    uses: ./.github/workflows/reusable_lint_test_build_update.yaml
    with:
      environment: ${{ inputs.environment || 'stlu-dev' }}
      configmanagement: ${{ inputs.configmanagement || 'gitlab.puzzle.ch/pitc_ruby/deployments/decidim/' }}
      configmanagement_branch: ${{ inputs.configmanagement_branch || 'main' }}
      kustomization_path: ${{ inputs.kustomization_path || './deployments/pitc-decidim-stlu-dev/kustomization.yaml' }}
      identifier: ${{ inputs.identifier || 'stlu-dev' }}
    secrets: inherit
