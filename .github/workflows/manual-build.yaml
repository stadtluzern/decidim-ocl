name: 'Manual build'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build for'
        type: choice
        required: true
        options:
          - stlu-dev
          - stlu-int
          - stlu-prod
        default: 'stlu-int'
      lint:
        description: 'Run lint?'
        type: boolean
        required: true
        default: false
      test:
        description: 'Run tests?'
        type: boolean
        required: true
        default: false
      push:
        description: 'Push the image to the registry?'
        type: boolean
        required: true
        default: true

jobs:
  lint:
    if: ${{ inputs.lint }}
    uses: ./.github/workflows/reusable_lint.yaml

  test:
    if: ${{ inputs.test }}
    uses: ./.github/workflows/reusable_tests.yaml

  build:
    needs: [lint, test]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/reusable_build.yaml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      push: ${{ inputs.push }}
