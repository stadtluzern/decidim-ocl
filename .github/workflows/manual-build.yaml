name: 'Manual build'

on:
  workflow_dispatch:
    inputs:
      image_repo:
        description: 'Registry to push the image to'
        type: string
        required: true
        default: 'https://harbor.puzzle.ch'
      images:
        description: 'Image to push to, without tag'
        type: string
        required: true
        default: 'harbor.puzzle.ch/decidim/stlu-int-rails'
      lint:
        description: 'Run lint?'
        type: boolean
        required: true
        default: false
      test:
        description: 'Run tests?'
        type: boolean
        required: true
        default: false
      push:
        description: 'Push the image to the registry?'
        type: boolean
        required: true
        default: true

jobs:
  lint:
    if: ${{ inputs.lint }}
    uses: ./.github/workflows/reusable_lint.yaml

  test:
    if: ${{ inputs.test }}
    uses: ./.github/workflows/reusable_tests.yaml

  build:
    needs: [lint, test]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/reusable_build.yaml
    secrets: inherit
    with:
      repository_url: ${{ inputs.image_repo }}
      images: ${{ inputs.images }}
      push: ${{ inputs.push }}
