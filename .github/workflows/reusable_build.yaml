name: 'Reusable: Build and push image'

# Builds the `app` target of the Dockerfile and pushes it as `:latest` and
# `:git-<sha>`. Tags are derived from the commit, not from a tags DSL, so
# nothing has to be passed in through the Actions UI.

on:
  workflow_call:
    inputs:
      repository_url:
        description: 'Registry to log in to, e.g. https://harbor.puzzle.ch'
        type: string
        required: true
      images:
        description: 'Image to push to, without tag, e.g. harbor.puzzle.ch/decidim/stlu-int-rails'
        type: string
        required: true
      push:
        description: 'Push the image to the registry'
        type: boolean
        required: false
        default: true
    secrets:
      REGISTRY_USERNAME:
        description: 'Username for registry login'
        required: true
      REGISTRY_TOKEN:
        description: 'Password for registry login'
        required: true

jobs:
  build:
    environment: deploy
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ inputs.repository_url }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          file: Dockerfile
          target: app
          build-args: |
            GITHUB_REF_NAME=${{ github.ref_name }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_REPOSITORY_URL=${{ github.repositoryUrl }}
            GITHUB_SHA=${{ github.sha }}
          tags: |
            ${{ inputs.images }}:latest
            ${{ inputs.images }}:git-${{ github.sha }}
          push: ${{ inputs.push }}

      - name: 'Report image tags'
        if: inputs.push
        run: |
          echo "::notice title=Image pushed::${IMAGE}:latest, ${IMAGE}:git-${{ github.sha }} (digest ${{ steps.build.outputs.digest }})"
          {
            echo '### Image pushed'
            echo
            echo '| Tag | Digest |'
            echo '| --- | --- |'
            echo "| \`${IMAGE}:latest\` | \`${{ steps.build.outputs.digest }}\` |"
            echo "| \`${IMAGE}:git-${{ github.sha }}\` | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ inputs.images }}
